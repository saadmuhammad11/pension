<!doctype html>
<html lang="en">

<body>

<div class="top"><div class="wrap topin">
  <div>
    <div class="t1">AI GP Fund Pre-Audit Module</div>
    <div class="t2">Office of the Accountant General Punjab &nbsp;·&nbsp; GP Fund Sections &amp; District Accounts Offices</div>
  </div>
  <div class="spacer"></div>
  <button class="toplink" id="lnkCases">Cases</button>
  <button class="toplink" id="lnkDoa">DOA register</button>
  <button class="toplink" id="lnkRules">Rules in force</button>
  <div class="whobox">
    <label for="who">Signed in as</label>
    <select class="who" id="who"></select>
  </div>
</div></div>

<div class="stepwrap" id="stepwrap"><div class="wrap">
  <div class="stepper" id="stepper">
    <div class="step active" data-s="1"><div class="dot">1</div>Intake</div>
    <div class="step" data-s="2"><div class="dot">2</div>Initial processing</div>
    <div class="step" data-s="3"><div class="dot">3</div>SAP extracts</div>
    <div class="step" data-s="4"><div class="dot">4</div>Examination</div>
    <div class="step" data-s="5"><div class="dot">5</div>Disposal</div>
    <div class="step" data-s="6"><div class="dot">6</div>Issue &amp; record</div>
    <div class="casetag" id="casetag"></div>
  </div>
</div></div>

<section class="screen on" id="s1"><div class="wrap" id="s1body"></div></section>
<section class="screen" id="s2"><div class="wrap" id="s2body"></div></section>
<section class="screen" id="s3"><div class="wrap" id="s3body"></div></section>
<section class="screen" id="s4"><div class="wrap" id="s4body"></div></section>
<section class="screen" id="s5"><div class="wrap" id="s5body"></div></section>
<section class="screen" id="s6"><div class="wrap" id="s6body"></div></section>
<section class="screen" id="sdoa"><div class="wrap" id="sdoabody"></div></section>
<section class="screen" id="srules"><div class="wrap" id="srulesbody"></div></section>

<div class="modal" id="modal"><div class="mbox">
  <div class="mhead"><div class="mt" id="mtitle"></div><div class="spacer"></div>
    <button class="abtn" id="mclose">Close</button></div>
  <div class="mbody" id="mbody"></div>
</div></div>

<input type="file" id="filepick" style="display:none">

/*__JS__*/
</script>
