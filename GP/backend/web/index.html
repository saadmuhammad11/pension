<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GP Fund Pre-Audit — AG Punjab</title>
  <!-- The shared design tokens, the same file the portal imports. Before styles.css,
       which adds the module's own and then uses them. -->
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- Government of the Punjab: crescent and star over a shield with the five rivers,
           wheat wreath, gold ring. Drawn rather than bitmapped, so it stays crisp and needs no
           external asset — this must run air-gapped. Same crest as the AI Pension Portal's
           header, so the two systems read as one office. -->
      <svg class="crest" viewBox="0 0 64 64" role="img" aria-label="Government of the Punjab">
        <circle cx="32" cy="32" r="30" fill="#14361F"/>
        <circle cx="32" cy="32" r="30" fill="none" stroke="#C9A227" stroke-width="2.5"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="#C9A227" stroke-width=".9" opacity=".55"/>
        <g stroke="#E7C55B" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".9">
          <path d="M51 26 q4 12 -5 20"/>
          <path d="M51 28 l5 -2.4"/><path d="M51.4 32.6 l5 -2.4"/>
          <path d="M51.8 37.2 l5 -2.4"/><path d="M52.2 41.8 l5 -2.4"/>
          <path d="M13 26 q-4 12 5 20"/>
          <path d="M13 28 l-5 -2.4"/><path d="M12.6 32.6 l-5 -2.4"/>
          <path d="M12.2 37.2 l-5 -2.4"/><path d="M11.8 41.8 l-5 -2.4"/>
        </g>
        <path d="M32 12a10.5 10.5 0 1 0 7.4 17.9A8.4 8.4 0 1 1 32 12Z" fill="#E7C55B"/>
        <path d="M43.6 15.4l1.05 2.7 2.85.2-2.2 1.8.72 2.8-2.42-1.6-2.42 1.6.72-2.8-2.2-1.8 2.85-.2z" fill="#E7C55B"/>
        <path d="M32 31c5.6 0 10 1.7 10 1.7v7.6c0 5.4-4.4 9-10 10.7-5.6-1.7-10-5.3-10-10.7v-7.6S26.4 31 32 31Z" fill="#EDF4EE"/>
        <g stroke="#2D6A4F" stroke-width="1.35" fill="none" stroke-linecap="round">
          <path d="M24.4 35.4c3.6 1.5 11.6 1.5 15.2 0"/>
          <path d="M24.4 38.4c3.6 1.5 11.6 1.5 15.2 0"/>
          <path d="M24.4 41.4c3.6 1.5 11.6 1.5 15.2 0"/>
          <path d="M24.4 44.4c3.6 1.5 11.6 1.5 15.2 0"/>
          <path d="M24.4 47.4c3.6 1.5 11.6 1.5 15.2 0"/>
        </g>
      </svg>
      <div>
        <div class="brand-title">GP Fund Pre-Audit</div>
        <div class="brand-sub">Government of the Punjab · Accountant General Office, Lahore ·
          <span class="urdu" style="display:inline-block">جی پی فنڈ پری آڈٹ</span></div>
      </div>
    </div>
    <nav class="mainnav" id="mainnav">
      <a href="#/cases" data-nav="cases">Cases</a>
      <a href="#/doa" data-nav="doa">DOA register</a>
      <a href="#/rules" data-nav="rules">Rules in force</a>
    </nav>
    <span class="pilot">PILOT</span>
    <div class="officer">
      <!-- Until there is authentication the role is a claim rather than an identity, so it is
           switched here openly rather than pretended to be a login. The server refuses an
           action claimed under too low a delegation whatever this control says. -->
      <label for="officer">ACTING AS</label>
      <select id="officer"></select>
      <div class="avatar" id="officer-initials" aria-hidden="true"></div>
    </div>
  </header>

  <main id="app" class="app"><div class="loading">Loading…</div></main>

  <div id="modal" class="modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
