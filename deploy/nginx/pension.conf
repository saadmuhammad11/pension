# /etc/nginx/sites-available/pension -- docs/DEPLOYMENT.md §3.8, §5.4, §11.3
# Replace pension.agpunjab.local and the certificate paths. For a public deployment keep the
# rate limits; on a LAN they do no harm.

limit_req_zone $binary_remote_addr zone=pension_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=pension_api:10m rate=20r/s;

# Scan images and the live progress stream carry the sign-in token on the address (?token=...),
# the one place a browser cannot put a header. The default access log would keep every officer's
# 12-hour token in plain text (audit 6 Oct 2026, S1): it is written as token=[redacted].
map $request_uri $pension_uri_logged {
    ~^(?<before>[^?]*\?(?:[^&]*&)*)token=[^&]*(?<after>.*)$  "${before}token=[redacted]${after}";
    default $request_uri;
}
log_format pension '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $pension_uri_logged $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" $request_time';

upstream pension_portal { server 127.0.0.1:5184; keepalive 16; }

server {
    listen 80;
    server_name pension.agpunjab.local;
    access_log /var/log/nginx/pension.access.log pension;
    # certbot's HTTP challenge, where a public certificate is used
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # The name is written out, not taken from the request's Host header (which the caller controls).
    location / { return 301 https://pension.agpunjab.local$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pension.agpunjab.local;

    ssl_certificate     /etc/ssl/pension/fullchain.pem;
    ssl_certificate_key /etc/ssl/pension/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pension_tls:10m;

    access_log /var/log/nginx/pension.access.log pension;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Scanned case bundles; the API refuses past its own limits (256 MB a file, 512 MB an upload).
    client_max_body_size 520m;

    # Never reachable from outside, whatever the application does (second layer).
    # (/gpf/ stays: the AG's GP Fund screen frames it, behind the portal's own sign-in check.)
    location ~ ^/(docs|redoc|openapi\.json|__portals|start\.html) { return 404; }

    location = /api/v2/auth/login {
        limit_req zone=pension_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://pension_portal;
        include /etc/nginx/snippets/pension-proxy.conf;
    }

    location /api/ {
        limit_req zone=pension_api burst=40;
        limit_req_status 429;
        proxy_pass http://pension_portal;
        include /etc/nginx/snippets/pension-proxy.conf;
    }

    location / {
        proxy_pass http://pension_portal;
        include /etc/nginx/snippets/pension-proxy.conf;
    }
}
