# /etc/nginx/snippets/pension-proxy.conf -- shared by every location in pension.conf
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# The portal server believes this header from 127.0.0.1 only (PENSION_TRUSTED_PROXIES).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Live progress (server-sent events) and long uploads.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
